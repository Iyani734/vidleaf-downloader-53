[project]
name = "vidleaf-backend"
version = "1.0.0"
description = "Permission-first asynchronous public YouTube download service for VidLeaf."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "rq>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["manual: explicitly enabled live smoke test; never runs in the normal suite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
